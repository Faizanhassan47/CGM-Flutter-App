org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dcom.sun.net.ssl.checkRevocation=false -Dcom.sun.security.enableCRLDP=false
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# Incremental Kotlin is much faster on rebuilds (was off only while debugging a hang).
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows can hang Maven downloads on CRYPT_E_NO_REVOCATION_CHECK.
systemProp.com.sun.net.ssl.checkRevocation=false
systemProp.com.sun.security.enableCRLDP=false
