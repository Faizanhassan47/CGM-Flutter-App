name: aima_cgm
description: "Aima CGM Flutter application and SDK integration example."
publish_to: none
version: 4.0.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  aima_style:
    path: Style
  cgm_sdk:
    path: packages/cgm_sdk
  permission_handler: ^11.3.1
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.1.2
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  google_sign_in: ^6.2.2
  pdf: ^3.13.1
  printing: ^5.15.1

dependency_overrides:
  image: 4.12.0
  archive: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
