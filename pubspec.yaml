name: aima_cgm
description: "Circle CGM Flutter application and SDK integration example."
publish_to: none
version: 4.0.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  aima_style:
    path: Style
  cgm_sdk:
    path: packages/cgm_sdk
  permission_handler: ^11.3.1
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.1.2
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  google_sign_in: ^6.2.2
  pdf: ^3.13.1
  printing: ^5.15.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  image_picker: ^1.2.4
  image_cropper: ^13.0.0

dependency_overrides:
  image: 4.12.0
  archive: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/circle_mark.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/circle_mark.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
