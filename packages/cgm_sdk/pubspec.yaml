name: cgm_sdk
description: CGM Device communication / protocol / algorithm / local storage core
version: 4.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.23.1
  sqlcipher_flutter_libs: ^0.6.5
  sqlite3: ^2.4.0
  flutter_blue_plus: ^1.35.2
  flutter_foreground_task: ^8.17.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  path_provider_platform_interface: ^2.1.2

flutter:
  assets:
    - assets/data/cgm_replay.csv
  plugin:
    platforms:
      android:
        package: com.linkxin.cgm_sdk
        pluginClass: CgmSdkPlugin
      ios:
        pluginClass: CgmSdkPlugin
